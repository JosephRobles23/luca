<!doctype html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<luca-parcial nombre="_Estilos"></luca-parcial>
<style>
  /* Guía de Luca: diálogo MODELESS (460×640) que se abre desde el botón Guía del panel. */
  html, body { height: 100%; }
  body { padding: 0; overflow: hidden; }
  .guia { height: 100%; display: flex; flex-direction: column; background: var(--canvas); }
  .guia-h { flex: none; display: flex; gap: 14px; align-items: center; padding: 16px 18px 14px; border-bottom: 1px solid var(--line); background: var(--card); }
  .guia-h .t { flex: 1; min-width: 0; }
  .guia-h b { font: 500 19px/1.15 var(--sans); letter-spacing: -.02em; display: block; }
  .guia-h small { color: var(--muted); font-size: 12.5px; }
  .guia-h .anillo { width: 52px; height: 52px; }
  .guia-h .anillo span { font-size: 12px; }
  .guia-b { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px 14px; }
  .guia-b .pasos { margin-top: 0; }
  .guia-f { flex: none; padding: 10px 18px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); background: var(--card); }
  .pas { cursor: pointer; }
</style>
</head>
<body>
<div class="guia">
  <div class="guia-h">
    <div class="anillo" id="anillo"></div>
    <div class="t"><b>Guía de Luca</b><small id="sub">Revisando tu avance…</small></div>
  </div>
  <div class="guia-b"><div class="box pasos" id="pasos"><div class="esq"></div><div class="esq media"></div><div class="esq"></div><div class="esq corta"></div></div></div>
  <div class="guia-f">Ciérrala cuando quieras: vuelve desde el botón <b>Guía</b> del panel (<b>Luca → ⚙️ Configuración</b>). Tu avance se detecta solo.</div>
</div>

<luca-parcial nombre="_Ui"></luca-parcial>
<script>
  if (typeof run !== 'function') { document.body.insertAdjacentHTML('afterbegin', '<p style="padding:14px;color:#cf2d56">No se cargó la interfaz de Luca (_Ui). Actualiza LucaLib o avísanos.</p>'); throw new Error('Luca: falta _Ui'); }
  function $(id) { return document.getElementById(id); }
  function anillo(frac, texto) {
    var r = 18, c = 2 * Math.PI * r;
    return '<svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="' + r + '" fill="none" stroke="var(--strong)" stroke-width="4"/>' +
      '<circle cx="22" cy="22" r="' + r + '" fill="none" stroke="var(--primary)" stroke-width="4" stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + (c * (1 - frac)) + '" style="transition:stroke-dashoffset var(--slow) var(--ease-out)"/></svg><span>' + texto + '</span>';
  }

  /* Pasos detectados con estadoLuca (los mismos datos que el panel). accion: 'panel:<pestaña>' | 'web' | '' (solo texto). */
  function pasosDe(s) {
    var sec = s.secretos || {}, tele = s.iphone || {}, lg = s.ledger || {};
    return [
      { t: 'Autorizar Luca', d: 'Importa el último mes de BCP y Yape y deja el escaneo automático cada 15 minutos. Menú <b>Luca → ✅ Autorizar / Escanear ahora</b>.',
        ok: s.autorizado && !!s.triggerInstaladoEn, accion: '' },
      { t: 'Revisar tus movimientos', d: 'Abre lucaa.lat y categoriza lo pendiente' + (lg.sinCategoria ? ' (' + lg.sinCategoria + ' por categorizar).' : '.'),
        ok: s.autorizado && !lg.sinCategoria, accion: 'web', boton: 'Abrir lucaa.lat' },
      { t: 'IA para categorizar (opcional)', d: 'Pega una API key gratuita de Google AI Studio: categoriza los comercios nuevos.',
        ok: !!sec.llmKey, accion: 'panel:ia', boton: 'Abrir IA en el panel' },
      { t: 'Conectar el iPhone', d: 'Para los yapeos recibidos, que no llegan por correo: un atajo los envía a tu hoja.',
        ok: !!(sec.iphone && (tele.lastEventAt || tele.lastTestAt)), accion: 'panel:iphone', boton: 'Abrir iPhone en el panel' },
      { t: 'Claude o ChatGPT (opcional)', d: 'Conecta tu IA para preguntarle por tus gastos.',
        ok: !!sec.mcp, accion: 'panel:mcp', boton: 'Abrir MCP en el panel' }
    ];
  }

  var acciones = [];
  function pintar(s) {
    var pasos = pasosDe(s);
    var hechos = pasos.filter(function (p) { return p.ok; }).length;
    var primero = pasos.findIndex(function (p) { return !p.ok; });
    $('anillo').innerHTML = anillo(hechos / pasos.length, hechos + '/' + pasos.length);
    $('sub').textContent = hechos === pasos.length ? 'Todo listo. Ya puedes cerrar esta guía.' : 'Te quedan ' + (pasos.length - hechos) + ' pasos. Tu avance se detecta solo.';
    var abierto = document.querySelector('#pasos .pas.activo');
    var abiertoIdx = abierto ? Number(abierto.dataset.i) : primero;
    acciones = pasos.map(function (p) { return p.accion; });
    $('pasos').innerHTML = pasos.map(function (p, i) {
      var cls = p.ok ? 'hecho' : '';
      if (i === abiertoIdx && !p.ok) cls += ' activo';
      var boton = !p.accion ? '' : p.accion === 'web'
        ? '<a class="boton" href="https://lucaa.lat/app" target="_blank" rel="noopener">' + icono('externo') + esc(p.boton) + '</a>'
        : '<button class="' + (i === primero ? '' : 'sec') + '" data-cargando="Abriendo…" onclick="hacer(' + i + ')">' + esc(p.boton) + '</button>';
      return '<div class="pas ' + cls + '" data-i="' + i + '" onclick="abrirPaso(this)"><div class="pas-h"><span class="pas-n">' + (p.ok ? icono('check') : i + 1) + '</span>' +
        '<span class="t">' + esc(p.t) + '<small>' + (p.ok ? 'Hecho' : i === primero ? 'Siguiente paso' : 'Pendiente') + '</small></span></div>' +
        '<div class="pas-c"><div><div class="hint" style="margin-top:0">' + p.d + '</div>' + boton + '</div></div></div>';
    }).join('');
  }
  function abrirPaso(el) {
    if (el.classList.contains('hecho') || el.classList.contains('activo')) return;
    document.querySelectorAll('#pasos .pas').forEach(function (x) { x.classList.remove('activo'); });
    el.classList.add('activo');
  }
  function hacer(i) {
    var a = acciones[i] || '';
    if (a.indexOf('panel:') === 0) run('abrirSidebar', a.slice(6)).then(function () { toast('Abierto en el panel de la derecha.'); }).catch(fallo);
  }
  function cargar() { return run('estadoLuca').then(pintar).catch(fallo); }

  cargar();
  // La hoja sigue libre detrás: refresca al volver a la guía y, si está visible, cada minuto.
  window.addEventListener('focus', cargar);
  setInterval(function () { if (!document.hidden) cargar(); }, 60000);
</script>
</body>
</html>
