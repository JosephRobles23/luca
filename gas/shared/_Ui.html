  var ICONO_CATEGORIA_ = {

    'Suscripciones': 'repetir', 'Salud': 'salud', 'Educación': 'birrete', 'Ropa': 'camisa', 'Ocio': 'ticket',
    'Transferencias': 'flechas', 'Otros': 'etiqueta', 'Ingreso': 'billetera', 'Sin categoría': 'duda'
  };
  // Palabras clave (sin acentos, minúsculas) → icono, para categorías propias. La primera que coincide gana.
  var ICONO_PALABRAS_ = [
    [/mascota|perro|gato|veterin/, 'huella'], [/viaje|vuelo|hotel|vacacion/, 'avion'], [/regalo|cumple/, 'regalo'],
    [/gym|gimnasio|deporte|fitness/, 'pesa'], [/cafe/, 'cafe'], [/auto|carro|gasolina|combustible|grifo|peaje|estacionamiento/, 'auto'],
    [/banco|comision|interes|prestamo|deuda|tarjeta/, 'banco'], [/bebe|hijo|nino|colegio/, 'bebe'], [/tecnolog|electron|gadget/, 'laptop'],
    [/ahorro|inversion/, 'hucha'], [/impuesto|sunat|tramite|multa/, 'recibo'], [/seguro/, 'escudo'], [/belleza|peluquer|barber|spa/, 'tijeras'],
    [/casa|hogar|alquiler|depa/, 'casa'], [/comida|restaurant|delivery|almuerzo/, 'cubiertos'], [/mercado|bodega|abarrote/, 'carrito'],
    [/taxi|uber|movilidad|bus/, 'bus'], [/luz|agua|internet|celular|telefon|gas/, 'rayo'], [/suscrip|streaming|netflix|spotify/, 'repetir'],
    [/salud|farmacia|medic|clinica|doctor/, 'salud'], [/curso|estudio|libro|universidad|educa/, 'birrete'], [/ropa|zapat|calzado/, 'camisa'],
    [/ocio|cine|salida|fiesta|concierto/, 'ticket'], [/transfer/, 'flechas'], [/sueldo|ingreso|salario/, 'billetera']
  ];
  function claveIconoCategoria(nombre) {
    if (!nombre) return 'duda';
    if (ICONO_CATEGORIA_.hasOwnProperty(nombre)) return ICONO_CATEGORIA_[nombre];
    var n = String(nombre).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    for (var i = 0; i < ICONO_PALABRAS_.length; i++) if (ICONO_PALABRAS_[i][0].test(n)) return ICONO_PALABRAS_[i][1];
    return 'etiqueta';
  }
  /* SVG del icono de una categoría (o de un movimiento: transferencia propia, yapeo recibido, ingreso sin categoría). */
  function iconoCategoria(nombre, tipo) {
    var clave = tipo === 'internal_transfer' ? 'flechas'
      : tipo === 'transfer_in' && !nombre ? 'recibir'
      : tipo === 'income' && !nombre ? 'billetera'
      : claveIconoCategoria(nombre);
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONOS_CAT_[clave] || ICONOS_[clave] || '') + '</svg>';
  }

  function icono(nombre) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONOS_[nombre] || '') + '</svg>';
  }
  function iconos(raiz) {
    (raiz || document).querySelectorAll('[data-icon]').forEach(function (el) { el.innerHTML = icono(el.getAttribute('data-icon')); });
  }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  /* Toast arriba, breve. tipo: 'ok' | 'error' | 'info'. Los errores duran más y se pueden cerrar. */
  function toast(msg, tipo) {
    tipo = tipo || 'ok';
    var t = document.createElement('div');
    t.className = 'toast ' + tipo;
    t.innerHTML = '<span class="ico">' + icono(tipo === 'error' ? 'alerta' : tipo === 'info' ? 'info' : 'check') + '</span><span></span>' +
      '<button type="button" aria-label="Cerrar">×</button>';
    t.querySelector('span:nth-child(2)').textContent = msg;
    function cerrar() { if (t._cerrado) return; t._cerrado = true; t.classList.add('sale'); setTimeout(function () { t.remove(); }, 240); }
    t.querySelector('button').onclick = cerrar;
    var cont = document.getElementById('toasts');
    cont.appendChild(t);
    while (cont.children.length > 3) cont.removeChild(cont.firstChild);
    setTimeout(cerrar, tipo === 'error' ? 7000 : 2800);
    return t;
  }
  function fallo(e) { toast((e && e.message) || String(e), 'error'); }

  /* Esqueleto de carga para una tarjeta (n líneas). */
  function esqueleto(n) {
    var h = '', anchos = ['', 'media', 'corta'];
    for (var i = 0; i < (n || 3); i++) h += '<div class="esq ' + anchos[i % 3] + '"></div>';
    return h;
  }

  /* Estado de carga automático: el botón pulsado queda deshabilitado con su texto de carga
     (data-cargando="Escaneando…") hasta que termina la llamada que lanzó su onclick. Patrón cosRun de CoS-Agent. */
  var btnActivo_ = null;
  document.addEventListener('click', function (e) {
    btnActivo_ = (e.target && e.target.closest) ? e.target.closest('button') : null;
    setTimeout(function () { btnActivo_ = null; }, 0);
  }, true);
  function cargando(btn, on) {
    if (!btn) return;
    if (on) {
      if (btn._cargando) return;
      btn._cargando = true; btn._html = btn.innerHTML;
      btn.classList.add('cargando'); btn.disabled = true; btn.setAttribute('aria-busy', 'true');
      btn.innerHTML = '<span class="puntos"><i></i><i></i><i></i></span><span>' + esc(btn.getAttribute('data-cargando') || 'Un momento…') + '</span>';
    } else {
      if (!btn._cargando) return;
      btn._cargando = false; btn.innerHTML = btn._html;
      btn.classList.remove('cargando'); btn.disabled = false; btn.removeAttribute('aria-busy');
    }
  }

  /* Puente único a la librería: lucaRun(método, argsJson) → dispatch (lista blanca). */
  function run(method) {
    var args = Array.prototype.slice.call(arguments, 1);
    var btn = btnActivo_; btnActivo_ = null;
    cargando(btn, true);
    return new Promise(function (resolve, reject) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).lucaRun(method, JSON.stringify(args));
    }).then(function (v) { cargando(btn, false); return v; },
      function (e) { cargando(btn, false); throw e; });
  }

  iconos();
</script>
