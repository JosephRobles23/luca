<!-- _Ui — utilidades de cliente comunes (sidebar y diálogos). Se inserta en el servidor con el marcador @incluir,
     antes del script propio de cada página. Expone: run, esc, toast, fallo, icono, iconos, esqueleto. -->
<div id="toasts" role="status" aria-live="polite"></div>
<script>
  /* Iconos Lucide en línea (sin dependencias). <i data-icon="nombre"></i> + iconos(); o icono('nombre') como HTML. */
  var ICONOS_ = {
    check: '<path d="M20 6 9 17l-5-5"/>',
    x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    alerta: '<circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>',
    info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
    actividad: '<path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/>',
    chispas: '<path d="M9.94 15.5A2 2 0 0 0 8.5 14.06l-6.14-1.58a.5.5 0 0 1 0-.96L8.5 9.94A2 2 0 0 0 9.94 8.5l1.58-6.14a.5.5 0 0 1 .96 0L14.06 8.5A2 2 0 0 0 15.5 9.94l6.14 1.58a.5.5 0 0 1 0 .96L15.5 14.06a2 2 0 0 0-1.44 1.44l-1.58 6.14a.5.5 0 0 1-.96 0z"/>',
    iphone: '<rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/>',
    enchufe: '<path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/>',
    brujula: '<circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-1.8 5.4a2 2 0 0 1-1.28 1.28l-5.4 1.8 1.8-5.4a2 2 0 0 1 1.28-1.28z"/>',
    refrescar: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
    copiar: '<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
    ajustes: '<path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/>',
    correo: '<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
    grafico: '<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
    externo: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
    chevron: '<path d="m9 18 6-6-6-6"/>',
    escudo: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',
    terminal: '<path d="m4 17 6-6-6-6"/><path d="M12 19h8"/>'
  };
  function icono(nombre) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONOS_[nombre] || '') + '</svg>';
  }
  function iconos(raiz) {
    (raiz || document).querySelectorAll('[data-icon]').forEach(function (el) { el.innerHTML = icono(el.getAttribute('data-icon')); });
  }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  /* Toast arriba, breve. tipo: 'ok' | 'error' | 'info'. Los errores duran más y se pueden cerrar. */
  function toast(msg, tipo) {
    tipo = tipo || 'ok';
    var t = document.createElement('div');
    t.className = 'toast ' + tipo;
    t.innerHTML = '<span class="ico">' + icono(tipo === 'error' ? 'alerta' : tipo === 'info' ? 'info' : 'check') + '</span><span></span>' +
      '<button type="button" aria-label="Cerrar">×</button>';
    t.querySelector('span:nth-child(2)').textContent = msg;
    function cerrar() { if (t._cerrado) return; t._cerrado = true; t.classList.add('sale'); setTimeout(function () { t.remove(); }, 240); }
    t.querySelector('button').onclick = cerrar;
    var cont = document.getElementById('toasts');
    cont.appendChild(t);
    while (cont.children.length > 3) cont.removeChild(cont.firstChild);
    setTimeout(cerrar, tipo === 'error' ? 7000 : 2800);
    return t;
  }
  function fallo(e) { toast((e && e.message) || String(e), 'error'); }

  /* Esqueleto de carga para una tarjeta (n líneas). */
  function esqueleto(n) {
    var h = '', anchos = ['', 'media', 'corta'];
    for (var i = 0; i < (n || 3); i++) h += '<div class="esq ' + anchos[i % 3] + '"></div>';
    return h;
  }

  /* Estado de carga automático: el botón pulsado queda deshabilitado con su texto de carga
     (data-cargando="Escaneando…") hasta que termina la llamada que lanzó su onclick. Patrón cosRun de CoS-Agent. */
  var btnActivo_ = null;
  document.addEventListener('click', function (e) {
    btnActivo_ = (e.target && e.target.closest) ? e.target.closest('button') : null;
    setTimeout(function () { btnActivo_ = null; }, 0);
  }, true);
  function cargando(btn, on) {
    if (!btn) return;
    if (on) {
      if (btn._cargando) return;
      btn._cargando = true; btn._html = btn.innerHTML;
      btn.classList.add('cargando'); btn.disabled = true; btn.setAttribute('aria-busy', 'true');
      btn.innerHTML = '<span class="puntos"><i></i><i></i><i></i></span><span>' + esc(btn.getAttribute('data-cargando') || 'Un momento…') + '</span>';
    } else {
      if (!btn._cargando) return;
      btn._cargando = false; btn.innerHTML = btn._html;
      btn.classList.remove('cargando'); btn.disabled = false; btn.removeAttribute('aria-busy');
    }
  }

  /* Puente único a la librería: lucaRun(método, argsJson) → dispatch (lista blanca). */
  function run(method) {
    var args = Array.prototype.slice.call(arguments, 1);
    var btn = btnActivo_; btnActivo_ = null;
    cargando(btn, true);
    return new Promise(function (resolve, reject) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).lucaRun(method, JSON.stringify(args));
    }).then(function (v) { cargando(btn, false); return v; },
      function (e) { cargando(btn, false); throw e; });
  }

  iconos();
</script>
